[project]
name = "docmind"
version = "0.1.0"
description = "DocMind —— 基于混合检索与引用溯源的私有文档智能问答系统"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# 工具链统一配置.
# 注意: 运行依赖不写在这里, 统一由 requirements.txt 管理, 避免两处漂移.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "slow: 需要加载本地模型或外部服务的慢用例(默认排除)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# 用 extend-exclude 而非 exclude: 后者会覆盖 Ruff 的内置默认排除项(.git 等).
# 排除 docs/*.md 是因为 Ruff 会连带格式化 Markdown 里的 Python 代码块,
# 而文档中的示例代码需要保留人工排版(注释对齐、示意性省略).
extend-exclude = [".venv", "data", "logs", "frontend", "docs", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # 强制使用 pathlib
    "RET",  # 简化 return
    "ARG",  # 未使用参数
    "T20",  # 禁止 print(生产代码用 logger)
    "PLC",  # pylint 约定
]
ignore = [
    "E501",  # 行长由 formatter 处理
    "B008",  # FastAPI 的 Depends() 默认值是标准写法
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["ARG", "S101"]
# 脚本允许 print(生产代码用 logger);
# 允许函数内 import —— 自检脚本必须能在依赖缺失时依然跑起来,
# 所以对 torch / app.core.config 等采用延迟导入并捕获 ImportError.
"backend/scripts/**" = ["T20", "PLC0415"]

[tool.ruff.lint.isort]
# 声明 app 为第一方包, 否则 ruff 会把 `from app.xxx` 误判为第三方,
# 排序结果与实际情况不符.
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false   # 渐进式类型化, 不强求
ignore_missing_imports = true
exclude = ["frontend", "data", "logs"]
