# =============================================================================
# DocMind 一键启动编排
#
# 默认的 embedded + inline 模式并不需要 Docker —— 只有下面这些场景才用得上:
#   - 需要任务队列(横向扩容解析 Worker)   -> redis + worker
#   - 需要多实例共享同一份向量数据        -> chroma
#   - 需要隔离的部署环境                  -> 全部服务
#
# 启动:  docker compose up -d
# 查看:  docker compose logs -f backend
# =============================================================================

name: docmind

services:
  # ------------------------------ 向量数据库 ------------------------------
  # 仅在 DOCMIND_CHROMA_MODE=http 时需要.
  # embedded 模式下 Chroma 内嵌在应用进程里, 无需此服务.
  chroma:
    image: chromadb/chroma:1.0.0
    container_name: docmind-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ------------------------------ 任务队列 --------------------------------
  redis:
    image: redis:7-alpine
    container_name: docmind-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------ 后端 API --------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docmind-backend:0.1.0
    container_name: docmind-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DOCMIND_HOST: 0.0.0.0
      DOCMIND_PORT: 8000
      DOCMIND_CHROMA_MODE: http
      DOCMIND_CHROMA_HOST: chroma
      DOCMIND_CHROMA_PORT: 8000
      DOCMIND_REDIS_URL: redis://redis:6379/0
      DOCMIND_TASK_MODE: queue
      DOCMIND_DATABASE_URL: sqlite+aiosqlite:////app/data/docmind.db
    volumes:
      # 原始文档与向量数据必须持久化, 否则容器重启后要重新解析全部 PDF
      - ./data:/app/data
      - ./logs:/app/logs
      - model_cache:/app/models
    ports:
      - "8000:8000"

  # ------------------------------ 解析 Worker -----------------------------
  # 与 API 服务共用镜像, 只是启动命令不同.
  # 大 PDF 解析 + 向量化是 CPU 密集任务, 单独扩容 Worker 不影响 API 响应延迟.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docmind-backend:0.1.0
    container_name: docmind-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DOCMIND_CHROMA_MODE: http
      DOCMIND_CHROMA_HOST: chroma
      DOCMIND_CHROMA_PORT: 8000
      DOCMIND_REDIS_URL: redis://redis:6379/0
      DOCMIND_TASK_MODE: queue
      DOCMIND_DATABASE_URL: sqlite+aiosqlite:////app/data/docmind.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - model_cache:/app/models
    command: ["python", "-m", "rq", "worker", "--url", "redis://redis:6379/0", "docmind"]

volumes:
  chroma_data:
  redis_data:
  # 模型缓存卷: 多个容器共享同一份下载好的模型, 避免重复下载 2GB+
  model_cache:
